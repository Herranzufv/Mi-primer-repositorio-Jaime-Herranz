<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Contacto</h1>
        <nav><ul><li><a href="index.html">Volver al Inicio</a></li></ul></nav>
    </header>
    <main>
        <h2>Envíame un mensaje</h2>
        <form>
            <label>Nombre:</label>
            <input type="text" placeholder="Tu nombre">
            
            <label>Email:</label>
            <input type="email" placeholder="tucorreo@ejemplo.com">
            
            <label>Mensaje:</label>
            <textarea rows="5" placeholder="Escribe aquí tu consulta..."></textarea>
            
            <button type="button">Enviar</button>
        </form>
    </main>
    <footer><p>&copy; 2025 Jaime Herranz</p></footer>
</body>
</html>
